[project]
name = "movie-bot"
version = "1.0.0"
description = "Telegram movie bot — auto-indexes media from a group and serves searches with a web admin panel"
requires-python = ">=3.11"
dependencies = [
    "aiogram>=3.13.0",
    "aiohttp>=3.10.0",
    "aiohttp-jinja2>=1.6",
    "aiosqlite>=0.20.0",
    "cachetools>=5.5.0",
    "jinja2>=3.1.4",
    "python-dotenv>=1.0.1",
    "openai>=1.30.0",
]
