{% extends "base.html" %}
{% block title %}ব্রডকাস্ট{% endblock %}
{% block content %}
<h1>DM ব্রডকাস্ট</h1>
<p class="muted">সব <strong>{{ user_count }}</strong> জন বট ইউজারের কাছে পার্সোনাল মেসেজ পাঠান।</p>

{% if flash %}
<div class="flash flash-{{ flash.kind }}">{{ flash.msg }}</div>
{% endif %}

<form method="post" enctype="multipart/form-data" class="form" id="bcForm">
  <label>
    মেসেজ টেক্সট / ক্যাপশন (HTML সাপোর্টেড)
    <textarea name="text" rows="6" placeholder="সবাইকে স্বাগতম! নতুন মুভি যোগ হয়েছে — &lt;b&gt;Inception&lt;/b&gt;"></textarea>
  </label>

  <label>
    মিডিয়া (ঐচ্ছিক)
    <select name="media_kind">
      <option value="none">কোনো মিডিয়া নয়</option>
      <option value="photo">ছবি</option>
      <option value="video">ভিডিও</option>
      <option value="document">ডকুমেন্ট</option>
    </select>
    <input type="file" name="media" style="margin-top:.4rem">
  </label>

  <div class="form-group">
    <label style="margin-bottom:.4rem;display:block">ইনলাইন বাটন (ঐচ্ছিক)</label>
    <small class="muted">প্রতিটি বাটনের জন্য নাম ও লিংক আলাদা করে দিন।</small>
    <div id="buttonRows" style="margin-top:.5rem"></div>
    <button type="button" onclick="addButtonRow()" class="btn ghost" style="margin-top:.5rem">➕ বাটন যোগ করুন</button>
    <textarea name="buttons" id="buttonsHidden" style="display:none"></textarea>
  </div>

  <div class="actions">
    <button type="submit" class="btn primary" onclick="serializeButtons()">📢 ব্রডকাস্ট শুরু করুন</button>
  </div>
</form>

<section id="status" style="margin-top:2rem">
  <h2>লাইভ অগ্রগতি</h2>
  <div id="status-box" class="muted">নিষ্ক্রিয়।</div>
</section>

<style>
.btn-row{display:flex;gap:.4rem;align-items:center;margin-bottom:.4rem;flex-wrap:wrap}
.btn-row input[type=text]{flex:1;min-width:120px}
.btn-row label{display:flex;align-items:center;gap:.25rem;font-size:.8rem;white-space:nowrap}
</style>

<script>
let rowCount = 0;

function addButtonRow(text='', url='', sameRow=false) {
  const id = rowCount++;
  const div = document.createElement('div');
  div.className = 'btn-row';
  div.id = 'brow_' + id;
  div.innerHTML = `
    <input type="text" placeholder="বাটনের নাম" value="${esc(text)}" class="btext" style="max-width:160px">
    <input type="text" placeholder="https://..." value="${esc(url)}" class="burl">
    <label><input type="checkbox" class="bsame" ${sameRow?'checked':''}> একই সারি</label>
    <button type="button" onclick="removeRow('brow_${id}')" class="btn danger" style="padding:.2rem .5rem">✕</button>
  `;
  document.getElementById('buttonRows').appendChild(div);
}

function removeRow(id){ const el=document.getElementById(id); if(el) el.remove(); }
function esc(s){ return (s||'').replace(/&/g,'&amp;').replace(/"/g,'&quot;'); }

function serializeButtons(){
  const rows = document.querySelectorAll('#buttonRows .btn-row');
  const lines = [];
  let curLine = [];
  rows.forEach((row, i) => {
    const text = row.querySelector('.btext').value.trim();
    const url = row.querySelector('.burl').value.trim();
    const same = row.querySelector('.bsame').checked;
    if(!text || !url) return;
    if(i === 0 || !same){
      if(curLine.length) lines.push(curLine.join(' && '));
      curLine = [text + ' - ' + url];
    } else {
      curLine.push(text + ' - ' + url);
    }
  });
  if(curLine.length) lines.push(curLine.join(' && '));
  document.getElementById('buttonsHidden').value = lines.join('\n');
}

async function tick() {
  try {
    const r = await fetch('/broadcast/status', { credentials: 'same-origin' });
    const d = await r.json();
    const box = document.getElementById('status-box');
    if (!d.running && d.sent === undefined) {
      box.innerHTML = 'নিষ্ক্রিয়।';
    } else {
      const pct = d.total ? Math.round((d.progress / d.total) * 100) : 0;
      box.innerHTML = `
        <div>${d.running ? '⏳ চলছে' : '✅ সম্পন্ন'} — ${d.progress}/${d.total} (${pct}%)</div>
        <div>পাঠানো: <b>${d.sent}</b> · ব্লকড: <b>${d.blocked}</b> · ব্যর্থ: <b>${d.failed}</b></div>
        <progress value="${d.progress}" max="${d.total}" style="width:100%; height:14px"></progress>
      `;
    }
  } catch (e) { /* ignore */ }
}
tick();
setInterval(tick, 1500);
</script>
{% endblock %}
